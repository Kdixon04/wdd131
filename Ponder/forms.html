<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Playground</title>
</head>
<body>
    <form>
        <label for="ssn">Enter your social security number</label>
        <input type="text" id="ssn" placeholder="111-11-1111" name="ssn" required="true">
        <input type="search" name="search" required>
        <input type="password" placeholder="password" name="password">
        <input type="tel" name="gimme your digits">
        <input type="color">
        <input type="file">

        <input type="submit" name="submit it">

    </form>
</body>
</html>
